<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
  />
  <title>JavaScript Notepad</title>
  <style>
    :root {
      --bg: #101218;
      --panel: #171a22;
      --panel-2: #1d212b;
      --border: #272c38;
      --text: #d7dce6;
      --muted: #8a93a6;
      --accent: #4f9cf9;
      --accent-2: #2f7ce0;
      --green: #5fd08a;
      --red: #f07a7a;
      --amber: #e0b25f;
      --mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    header .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    header .brand .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
    }

    header .spacer { flex: 1; }

    button {
      font: inherit;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) { background: #262c39; border-color: #333a49; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #06121f;
      font-weight: 600;
    }

    button.primary:hover:not(:disabled) { background: #66aafb; border-color: #66aafb; }

    button.danger {
      background: transparent;
      border-color: #5a2b2b;
      color: var(--red);
    }

    button.danger:hover:not(:disabled) { background: #2a1a1a; }

    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .bar label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    input[type="text"] {
      font: inherit;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      outline: none;
    }

    input[type="text"]:focus { border-color: var(--accent); }

    #filename { width: 200px; font-family: var(--mono); }

    #location {
      flex: 1;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .pane + .pane { border-left: 1px solid var(--border); }

    .pane-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
    }

    .pane-head .spacer { flex: 1; }

    .pane-head button { padding: 4px 10px; font-size: 12px; }

    .editor-wrap {
      flex: 1;
      display: flex;
      min-height: 0;
      background: #12151c;
    }

    #gutter {
      padding: 12px 8px 12px 12px;
      text-align: right;
      color: #4b5468;
      background: #12151c;
      border-right: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 20px;
      overflow: hidden;
      user-select: none;
      white-space: pre;
    }

    #code {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      padding: 12px 14px;
      background: #12151c;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 20px;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }

    #code::selection { background: #2f4a6d; }

    .console {
      flex: 1;
      margin: 0;
      padding: 12px 14px;
      overflow: auto;
      background: #0d0f15;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .console .err { color: var(--red); }
    .console .out { color: var(--text); }
    .console .sys { color: var(--muted); font-style: italic; }
    .console .placeholder { color: #4b5468; font-style: italic; font-family: inherit; }

    .stdin {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    .stdin input { flex: 1; font-family: var(--mono); }

    footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-dot.running { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.error { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .status-dot.stopped { background: var(--amber); }

    footer .spacer { flex: 1; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>JavaScript Notepad</div>
    <div class="spacer"></div>
    <button id="open">Open</button>
    <button id="save">Save</button>
    <button id="choose">Choose Folder</button>
    <button id="run" class="primary">Run</button>
    <button id="stop" class="danger" disabled>Stop</button>
  </header>

  <div class="bar">
    <label for="filename">File</label>
    <input id="filename" type="text" value="script.js" spellcheck="false" />
    <span id="location"></span>
  </div>

  <main>
    <section class="pane">
      <div class="pane-head">
        <span>Editor</span>
        <div class="spacer"></div>
        <span id="dirty"></span>
      </div>
      <div class="editor-wrap">
        <div id="gutter">1</div>
        <textarea id="code" spellcheck="false" wrap="off"></textarea>
      </div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <span>Output</span>
        <div class="spacer"></div>
        <button id="clear">Clear</button>
      </div>
      <pre id="console" class="console"><span class="placeholder">Run your script to see the result here.</span></pre>
      <div class="stdin">
        <input id="input" type="text" placeholder="Type input and press Enter to send to a running script" spellcheck="false" disabled />
      </div>
    </section>
  </main>

  <footer>
    <span id="status-dot" class="status-dot"></span>
    <span id="status">Idle</span>
    <div class="spacer"></div>
    <span id="runtime"></span>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
